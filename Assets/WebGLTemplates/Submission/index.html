<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #submission { width: 960px; height: 600px; max-width: 100vw; max-height: 100vh; position: absolute; inset: 0; margin: auto; display: flex; align-items: center; justify-content: center; }
    #unity-canvas { display: block; width: 960px; height: 540px; background: #000; }
    #submission:fullscreen { width: 100vw; height: 100vh; max-width: none; max-height: none; }
    #status { position: absolute; color: white; font: 16px sans-serif; pointer-events: none; }
    #fullscreen { position: fixed; right: 8px; bottom: 8px; border: 1px solid #777; background: #111; color: #eee; padding: 5px 9px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="submission"><canvas id="unity-canvas" width="960" height="540" tabindex="0"></canvas><span id="status">게임 불러오는 중…</span></div>
  <button id="fullscreen" aria-label="전체 화면">전체 화면</button>
  <script>
    const frame = document.getElementById('submission');
    const canvas = document.getElementById('unity-canvas');
    const status = document.getElementById('status');
    function fitCanvas() {
      const scale = Math.min(frame.clientWidth / 960, frame.clientHeight / 540);
      canvas.style.width = (960 * scale) + 'px';
      canvas.style.height = (540 * scale) + 'px';
    }
    window.addEventListener('resize', fitCanvas);
    document.addEventListener('fullscreenchange', fitCanvas);
    fitCanvas();
    const buildUrl = 'Build';
    const config = {
      dataUrl: buildUrl + '/{{{ DATA_FILENAME }}}',
      frameworkUrl: buildUrl + '/{{{ FRAMEWORK_FILENAME }}}',
#if USE_WASM
      codeUrl: buildUrl + '/{{{ CODE_FILENAME }}}',
#endif
#if MEMORY_FILENAME
      memoryUrl: buildUrl + '/{{{ MEMORY_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + '/{{{ SYMBOLS_FILENAME }}}',
#endif
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: 1
    };
    const loader = document.createElement('script');
    loader.src = buildUrl + '/{{{ LOADER_FILENAME }}}';
    loader.onload = () => createUnityInstance(canvas, config, progress => {
      status.textContent = '게임 불러오는 중… ' + Math.round(progress * 100) + '%';
    }).then(instance => {
      status.hidden = true;
      document.getElementById('fullscreen').onclick = () => frame.requestFullscreen().catch(console.error);
      canvas.focus();
    }).catch(error => { status.textContent = '게임을 불러오지 못했습니다: ' + error; console.error(error); });
    loader.onerror = () => { status.textContent = '빌드 파일을 불러오지 못했습니다.'; };
    document.body.appendChild(loader);
  </script>
</body>
</html>
